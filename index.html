<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título de mi Página Web Completa</title>
    <style>
        /* Estilos CSS Básicos para visualizar la estructura */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header { background: #333; color: #fff; padding: 1rem; text-align: center; }
        nav { background: #444; color: #fff; padding: 0.5rem; text-align: center; }
        nav a { color: #fff; margin: 0 10px; text-decoration: none; }
        main { padding: 20px; float: left; width: 70%; }
        aside { background: #f4f4f4; padding: 20px; float: right; width: 25%; height: 100vh; }
        footer { background: #333; color: #fff; text-align: center; padding: 1rem; clear: both; }
        @media (max-width: 768px) { main, aside { width: 100%; float: none; } }
    </style>
</head>
<body>

    <header>
        <h1>Mi Sitio Web</h1>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </nav>

    <main>
        <h2>Bienvenido a mi sitio</h2>
        <p>Este es un ejemplo de estructura HTML5 semántica completa</p>
        <article>
            <h3>Artículo Principal</h3>
            <p>Contenido detallado de la página aquí</p>
        </article>
    </main>

    <aside>
        <h3>Barra Lateral</h3>
        <p>Enlaces adicionales o información relevante</p>
    </aside>

    <footer>
        <p>&copy; 2026 Mi Sitio Web</p>
    </footer>

</body>
</html>
